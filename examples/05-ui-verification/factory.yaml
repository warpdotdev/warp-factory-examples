schemaVersion: v1alpha1
name: ui-verification
description: >-
  This factory uses one agent to verify UI behavior with computer use.
  Label a pull request or issue to have the agent run the app, test it
  in a browser, and post visual evidence.
alias: Verifier
repositories:
  - owner: acme
    name: webapp
agentDefaults:
  model: auto
  runner: linux-app
