description: >-
  Both agents inherit this runner. The node:22-bookworm-slim image includes
  Node and npm, so the implementation agent can run the service's tests
  without a setup command installing the toolchain.
instanceShape:
  vcpus: 4
  memoryGb: 8
platform:
  os: linux
  arch: x86_64
  linux:
    dockerImage: node:22-bookworm-slim
