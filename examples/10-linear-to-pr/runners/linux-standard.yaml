description: >-
  The one runner both agents inherit. The image is where the toolchain comes
  from: node:22-bookworm-slim already has Node and npm, so the implementation
  agent can run the service's tests without a setup command installing them.
instanceShape:
  vcpus: 4
  memoryGb: 8
platform:
  os: linux
  arch: x86_64
  linux:
    dockerImage: node:22-bookworm-slim
