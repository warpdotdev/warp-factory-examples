description: >-
  This arm64 runner supports implementation in repositories that build and
  test on aarch64. The runner's architecture is independent of the agent's
  harness. The image must provide an arm64 variant.
instanceShape:
  vcpus: 4
  memoryGb: 8
platform:
  os: linux
  arch: aarch64
  linux:
    dockerImage: ubuntu:24.04
