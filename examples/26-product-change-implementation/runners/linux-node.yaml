description: >-
  One runner for every stage. node:22-bookworm-slim already has Node and npm,
  so the implementer can install the web app's dependencies and run its
  tests and linter without a setup command; the spec and review stages only
  read code.
instanceShape:
  vcpus: 4
  memoryGb: 8
platform:
  os: linux
  arch: x86_64
  linux:
    dockerImage: node:22-bookworm-slim
