description: >-
  Every stage shares this runner. The node:22-bookworm-slim image includes
  Node and npm. The implementer can install the web app's dependencies and
  run its checks without a setup command installing the toolchain.
  The reviewer can also run checks when possible.
instanceShape:
  vcpus: 4
  memoryGb: 8
platform:
  os: linux
  arch: x86_64
  linux:
    dockerImage: node:22-bookworm-slim
