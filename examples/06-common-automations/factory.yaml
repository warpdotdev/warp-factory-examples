schemaVersion: v1alpha1
name: common-automations
description: >-
  This factory uses one maintenance agent to triage CI failures, audit
  dependencies weekly, check documentation on push, and create issues
  from Slack reactions.
alias: Maintenance
repositories:
  - owner: acme
    name: api-service
integrations:
  - type: slack
agentDefaults:
  model: auto
  runner: linux-standard
