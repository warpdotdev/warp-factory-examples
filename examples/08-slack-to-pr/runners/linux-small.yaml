description: >-
  Small runner for a single Node service. The image provides the toolchain:
  node:22-bookworm-slim already has Node and npm, so no setup command has to
  install them. Swap the image for whatever your repository builds with.
instanceShape:
  vcpus: 2
  memoryGb: 4
platform:
  os: linux
  arch: x86_64
  linux:
    dockerImage: node:22-bookworm-slim
