description: >-
  This small runner supports a single Node service. The
  node:22-bookworm-slim image includes Node and npm, so setup commands
  don't need to install them. Replace the image if your repository uses a
  different toolchain.
instanceShape:
  vcpus: 2
  memoryGb: 4
platform:
  os: linux
  arch: x86_64
  linux:
    dockerImage: node:22-bookworm-slim
